<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea Fox</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#003366;
    text-align:center;
    padding:20px;
}

.logo{
    width:300px;
    max-width:90%;
}

nav{
    margin-top:20px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
    font-weight:bold;
}

.hero{
    height:85vh;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

.hero h1{
    font-size:65px;
}

.hero p{
    font-size:28px;
    margin-top:15px;
}

.btn{
    margin-top:30px;
    padding:15px 35px;
    background:#00bcd4;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:20px;
}

.btn:hover{
    background:#0097a7;
}

</style>

</head>

<body>

<header>

<img src="logo.png.png" class="logo" alt="Sea Fox Logo">

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>Welcome To Sea Fox</h1>

<p>Diving & Marine Contractor</p>

<a href="#" class="btn">Our Services</a>

</section>

</body>
</html>
